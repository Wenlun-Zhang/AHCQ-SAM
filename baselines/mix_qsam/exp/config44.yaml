a_qconfig:
    quantizer: FixedFakeQuantize
    observer: AvgMinMaxObserver
    bit: 4
    symmetric: false
    ch_axis: -1
w_qconfig:
    quantizer: FixedFakeQuantize
    observer: MSEObserver
    bit: 4
    symmetric: false
    ch_axis: 0
calibrate:
    sample: 32
mix_qsam:
    enabled: true
    layer_granularity: fine
    solver: cvxpy
    cvxpy_solver: CBC
    cvxpy_verbose: true
    solver_time_limit: 600
    use_bitops: true
    min_budget_ratio: 0.95
    candidate_bits: [2, 3, 4, 5, 6]
    target_bits: 4
    score_samples: 64
    max_boxes_per_image: 16
    lambda_btr: 0.1
    eps: 0.000001
    score_cache: null
ptq4sam:
    BIG: true
    AGQ: true
    global_num: 128
    peak_distance: 32
    peak_height: 0.01
