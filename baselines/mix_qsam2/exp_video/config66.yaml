a_qconfig:
    quantizer: LSQFakeQuantize
    observer: AvgMinMaxObserver
    bit: 6
    symmetric: false
    ch_axis: -1
w_qconfig:
    quantizer: AdaRoundFakeQuantize
    observer: MSEObserver
    bit: 6
    symmetric: false
    ch_axis: 0
calibrate:
    sample: 8
    frame: 4
recon:
    scale_lr: 4.0e-5
    warm_up: 0.2
    weight: 0.01
    iters: 20000
    b_range: [20, 2]
    keep_gpu: true
    round_mode: learned_hard_sigmoid
    drop_prob: 0.5
ptq4sam:
    BIG: true
    AGQ: true
    global_num: 128
    peak_distance: 32
    peak_height: 0.01
mix_qsam2:
    enabled: true
    target_bits: 6
    candidate_bits: [5, 6, 7]
    score_samples: 8
    score_frames: 4
    exclude_first_last: true
    eps: 0.000001
    score_cache: null
    sis:
        enabled: true
        capacity: 7
        topk: 3
