a_qconfig:
    quantizer: LSQFakeQuantize
    observer: AvgMinMaxObserver
    bit: 5
    symmetric: False
    ch_axis: -1
w_qconfig:
    quantizer: AdaRoundFakeQuantize
    observer: MSEObserver
    bit: 5
    symmetric: False
    ch_axis: 0
ahcqsam:
    acnr: True
    k: 200
    cag: True
    group: 4
    hluq: True
    lnq: True
calibrate:
    sample: 8
    frame: 4
recon:
    scale_lr: 4.0e-5
    warm_up: 0.2
    weight: 0.01
    iters: 20000
    b_range: [20, 2]
    keep_gpu: True
    round_mode: learned_hard_sigmoid
    drop_prob: 0.5
ptq4sam:
    BIG: False
    AGQ: False
    global_num: 128
    peak_distance: 32
    peak_height: 0.01
